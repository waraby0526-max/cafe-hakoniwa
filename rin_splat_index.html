<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>凛（単体スプラット）</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0d1020;
    font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }
  #loading { position:fixed; inset:0; display:flex; flex-direction:column; gap:14px;
    align-items:center; justify-content:center; background:#0d1020; color:#f3e7d3; z-index:20;
    transition:opacity .6s; }
  #loading.done { opacity:0; pointer-events:none; }
  #loading .cup { font-size:40px; animation:bob 1.6s ease-in-out infinite; }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  #loading .msg { font-size:14px; letter-spacing:.06em; }
  #loading .sub { font-size:11.5px; color:#9aa3c0; }
  #hud { position:fixed; left:10px; bottom:10px; z-index:10; display:flex; gap:8px; align-items:center; }
  #hud button { background:rgba(20,16,13,.72); color:#f3e7d3; border:1px solid rgba(255,205,140,.45);
    border-radius:999px; padding:8px 14px; font-size:12.5px; cursor:pointer; backdrop-filter:blur(4px); }
  #hud button:active { background:rgba(255,205,140,.25); }
  #title { position:fixed; top:10px; left:12px; z-index:10; color:#f3e7d3; font-size:13px;
    letter-spacing:.06em; text-shadow:0 1px 6px rgba(0,0,0,.8); }
  #title .s { display:block; font-size:11px; color:#cbb694; margin-top:2px; }
  #err { position:fixed; inset:auto 12px 64px 12px; z-index:30; display:none;
    background:rgba(80,20,20,.92); color:#ffd9d9; border-radius:10px; padding:12px 14px; font-size:12.5px; line-height:1.6; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
  "@mkkellogg/gaussian-splats-3d": "https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@0.4.7/build/gaussian-splats-3d.module.js"
} }
</script>
</head>
<body>
<div id="app"></div>
<div id="title">凛・単体スプラット<span class="s">ドラッグで回転／ピンチで寄る・引く。分離実験：凛だけを別撮りして立体化した試作です。</span></div>
<div id="loading"><div class="cup">☕</div><div class="msg">凛を読み込んでいます…</div><div class="sub">写真から作った立体（3D Gaussian Splatting）です</div></div>
<div id="hud"><button id="resetView">視点をリセット</button></div>
<div id="err"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { VRButton } from 'three/addons/webxr/VRButton.js';
import * as GaussianSplats3D from '@mkkellogg/gaussian-splats-3d';

const loadingEl = document.getElementById('loading');
const errEl = document.getElementById('err');
function showErr(m) { errEl.textContent = m; errEl.style.display = 'block'; loadingEl.classList.add('done'); }

const CAM_HOME = new THREE.Vector3(0, 0.6, 12.0);
const TARGET_HOME = new THREE.Vector3(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.xr.enabled = true;
document.getElementById('app').appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer));

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1020);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 500);
camera.position.copy(CAM_HOME);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(TARGET_HOME);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 0.5;
controls.maxDistance = 60;
controls.update();

renderer.xr.addEventListener('sessionstart', () => { controls.enabled = false; });
renderer.xr.addEventListener('sessionend', () => { controls.enabled = true; });

document.getElementById('resetView').addEventListener('click', () => {
  camera.position.copy(CAM_HOME);
  controls.target.copy(TARGET_HOME);
  controls.update();
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// PLY space is Z-up (nerfstudio export). Rotate -90 deg about X to make it Y-up in three.js.
const viewer = new GaussianSplats3D.DropInViewer({
  sharedMemoryForWorkers: false,
  gpuAcceleratedSort: false,
  dynamicScene: false
});
scene.add(viewer);

viewer.addSplatScene('rin_splat.zip', {
  format: GaussianSplats3D.SceneFormat.Splat,
  showLoadingUI: false,
  position: [0, 0, 0],
  rotation: [-0.70710678, 0, 0, 0.70710678],
  scale: [1, 1, 1],
  splatAlphaRemovalThreshold: 5
}).then(() => {
  loadingEl.classList.add('done');
}).catch((e) => {
  showErr('読み込みに失敗しました: ' + (e && e.message ? e.message : e));
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
