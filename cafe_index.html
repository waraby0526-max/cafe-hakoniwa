<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>喫茶店の箱庭</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#14100d;
    font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }

  .chip { position:fixed; z-index:10; color:#f3e7d3; background:rgba(24,17,12,.72);
    border:1px solid rgba(255,205,140,.25); border-radius:10px; padding:6px 12px;
    font-size:13px; letter-spacing:.05em; backdrop-filter:blur(4px); pointer-events:none; }
  #title { top:12px; left:12px; font-size:15px; font-weight:600; }
  #wallStatus { top:12px; right:12px; text-align:right; color:#ffd9a0; }

  #presets { position:fixed; z-index:10; left:50%; bottom:16px; transform:translateX(-50%);
    display:flex; gap:8px; }
  #presets button { pointer-events:auto; cursor:pointer; color:#f3e7d3;
    background:rgba(24,17,12,.78); border:1px solid rgba(255,205,140,.35);
    border-radius:999px; padding:9px 18px; font-size:14px; letter-spacing:.08em; }
  #presets button.active { background:#8a5a2b; border-color:#ffcf90; color:#fff4e0; }
  #presets button:active { transform:scale(.96); }

  #loading { position:fixed; inset:0; z-index:20; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; background:#14100d; color:#f3e7d3;
    transition:opacity .6s; }
  #loading.done { opacity:0; pointer-events:none; }
  #loading .bar { width:min(70vw,320px); height:8px; border-radius:4px;
    background:rgba(255,255,255,.12); overflow:hidden; }
  #loading .bar > div { height:100%; width:0%; background:#e8a54b; transition:width .2s; }
  #loadMsg { font-size:13px; color:#cbb694; min-height:1.2em; text-align:center; padding:0 16px; }
  #loadErr { font-size:13px; color:#ff9a8a; max-width:86vw; text-align:center; white-space:pre-line; }

  #VRButton { position:fixed !important; right:12px !important; bottom:64px !important;
    left:auto !important; z-index:11; border-radius:999px !important;
    background:rgba(24,17,12,.78) !important; border:1px solid rgba(255,205,140,.35) !important;
    color:#f3e7d3 !important; font-size:13px !important; padding:9px 16px !important; width:auto !important; }

  #vignette { position:fixed; inset:0; z-index:5; pointer-events:none;
    background:radial-gradient(ellipse at 50% 42%, rgba(0,0,0,0) 52%, rgba(24,12,4,0.38) 100%); }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app"></div>
<div id="vignette"></div>
<div id="title" class="chip">☕ 喫茶店の箱庭</div>
<div id="wallStatus" class="chip">壁はすべて表示中</div>
<div id="modelErr" class="chip" style="top:auto;bottom:64px;left:12px;right:auto;color:#ff9a8a;display:none;"></div>
<div id="presets">
  <button data-view="all" class="active">全体</button>
  <button data-view="table">テーブル</button>
  <button data-view="counter">カウンター</button>
  <button data-view="top">真上</button>
</div>
<div id="loading">
  <div style="font-size:17px;">☕ 喫茶店の箱庭</div>
  <div class="bar"><div id="loadBar"></div></div>
  <div id="loadMsg">読み込み中…</div>
  <div id="loadErr"></div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { VRButton } from 'three/addons/webxr/VRButton.js';

/* ================================================================
   調整用パラメータ（モデルの向き・大きさ・配置はここで直せます）
   - FRONT_OFFSET: モデルが想定と逆を向いていたら Math.PI を足す
     （既定は「モデルの正面 = +Z 方向」想定）
   - MANAGER_H: 店長の身長 / SEATED_H: 着座フィギュア(椅子込み)の高さ
   ================================================================ */
const MANAGER_H = 1.00;
const SEATED_H  = MANAGER_H * 0.62;
const FRONT_OFFSET = { rin: 0, shiro: 0, manager: 0 };
const PLACEMENT = {
  rin:     { pos: new THREE.Vector3(-0.55, 0,  0.10), faceTo: new THREE.Vector3( 0.65, 0, 0.20) },
  shiro:   { pos: new THREE.Vector3( 0.65, 0,  0.20), faceTo: new THREE.Vector3(-0.55, 0, 0.10) },
  manager: { pos: new THREE.Vector3(-0.15, 0, -1.40), faceTo: new THREE.Vector3(-0.15, 0, 5.00) },
};
const TABLE_POS = new THREE.Vector3(0.05, 0, 0.15);

/* 部屋の寸法 */
const ROOM = { w: 3.4, d: 3.2, h: 1.9, wallT: 0.08 };   // 内寸: x ±1.7 / z -1.6..+1.6

/* ---------------- renderer / scene / camera ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.xr.enabled = true;
document.getElementById('app').appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer));

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1626);

const camera = new THREE.PerspectiveCamera(46, innerWidth / innerHeight, 0.05, 100);
camera.position.set(2.2, 1.6, 3.6);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.5, -0.3);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.maxDistance = 9;
controls.minDistance = 0.4;
controls.maxPolarAngle = Math.PI * 0.55;

/* ---------------- lights ---------------- */
scene.add(new THREE.HemisphereLight(0xffe6c4, 0x2a1c12, 0.55));
const sun = new THREE.DirectionalLight(0xffd9a8, 2.0);
sun.position.set(2.6, 3.4, 2.4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -2.6; sun.shadow.camera.right = 2.6;
sun.shadow.camera.top = 2.6; sun.shadow.camera.bottom = -2.6;
sun.shadow.camera.far = 12;
sun.shadow.bias = -0.0004;
sun.shadow.radius = 4;
scene.add(sun);
const fill = new THREE.DirectionalLight(0x9db8ff, 0.25);   // 窓からの夕空の光
fill.position.set(3.5, 1.6, -0.5);
scene.add(fill);

/* ---------------- procedural canvas textures ---------------- */
function canvasTex(w, h, draw, rx = 1, ry = 1) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  return t;
}
const brickTex = canvasTex(512, 256, (g, w, h) => {
  g.fillStyle = '#a08b74'; g.fillRect(0, 0, w, h);
  const bh = 32, bw = 84;
  const cols = ['#8d4a32', '#96543a', '#7e4230', '#9c5a3c', '#87492f'];
  for (let y = 0, row = 0; y < h; y += bh, row++) {
    for (let x = -bw; x < w + bw; x += bw) {
      const ox = (row % 2) * bw / 2;
      g.fillStyle = cols[(Math.random() * cols.length) | 0];
      g.fillRect(x + ox + 3, y + 3, bw - 6, bh - 6);
      g.fillStyle = 'rgba(255,220,180,0.06)';
      g.fillRect(x + ox + 3, y + 3, bw - 6, 5);
    }
  }
}, 3, 1.6);
const woodTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#7a5230'; g.fillRect(0, 0, w, h);
  const rows = 6;
  for (let r = 0; r < rows; r++) {
    const y = r * h / rows;
    g.fillStyle = ['#815931', '#75502c', '#86603a'][(Math.random() * 3) | 0];
    g.fillRect(0, y, w, h / rows - 2);
    g.strokeStyle = 'rgba(40,22,10,0.55)'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(0, y + h / rows - 2); g.lineTo(w, y + h / rows - 2); g.stroke();
    g.strokeStyle = 'rgba(60,36,16,0.25)'; g.lineWidth = 1;
    for (let i = 0; i < 9; i++) {
      const gy = y + 4 + Math.random() * (h / rows - 10);
      g.beginPath(); g.moveTo(0, gy);
      g.bezierCurveTo(w * .3, gy + 3, w * .7, gy - 3, w, gy); g.stroke();
    }
  }
}, 2, 2);
const darkWoodTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#4c3018'; g.fillRect(0, 0, w, h);
  g.strokeStyle = 'rgba(20,10,4,0.35)';
  for (let i = 0; i < 40; i++) {
    const y = Math.random() * h; g.beginPath(); g.moveTo(0, y); g.lineTo(w, y + (Math.random() * 6 - 3)); g.stroke();
  }
}, 1, 1);
const glassTex = canvasTex(256, 256, (g, w, h) => {
  const cols = ['#f7b733', '#f9d976', '#ffd23f', '#f39c3d', '#e8a13c', '#ffe08a', '#a8b56b', '#7fb069'];
  const n = 5, s = w / n;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    g.fillStyle = cols[(Math.random() * cols.length) | 0];
    g.fillRect(x * s, y * s, s, s);
    g.fillStyle = 'rgba(255,255,255,0.13)'; g.fillRect(x * s, y * s, s, s / 2.4);
  }
  g.strokeStyle = '#2c1c10'; g.lineWidth = 7;
  for (let i = 0; i <= n; i++) {
    g.beginPath(); g.moveTo(i * s, 0); g.lineTo(i * s, h); g.stroke();
    g.beginPath(); g.moveTo(0, i * s); g.lineTo(w, i * s); g.stroke();
  }
}, 1, 1);
const skyTex = canvasTex(256, 384, (g, w, h) => {
  // 窓の外：夕景のボケ（濃い青＋暖色の丸い光）
  const gr = g.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0, '#0d1c36'); gr.addColorStop(0.6, '#1b3358'); gr.addColorStop(1, '#2c4a73');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  const bok = [[60, 120, 22, '255,170,90'], [120, 220, 32, '255,150,70'], [182, 92, 15, '255,200,130'],
    [92, 300, 17, '255,180,100'], [202, 262, 11, '255,220,180'], [150, 162, 10, '240,240,255'],
    [42, 58, 10, '255,190,120'], [215, 180, 8, '255,210,150'], [70, 200, 8, '255,230,200']];
  for (const [x, y, r, c] of bok) {
    const rg = g.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, `rgba(${c},0.9)`); rg.addColorStop(0.55, `rgba(${c},0.35)`); rg.addColorStop(1, `rgba(${c},0)`);
    g.fillStyle = rg; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
  g.fillStyle = '#ffffff';
  for (let i = 0; i < 26; i++) { g.globalAlpha = Math.random() * .7 + .2; g.fillRect(Math.random() * w, Math.random() * h * .5, 1.6, 1.6); }
  g.globalAlpha = 1;
}, 1, 1);
const steamTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(64, 64, 4, 64, 64, 62);
  gr.addColorStop(0, 'rgba(255,255,255,0.55)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();

/* ---------------- materials ---------------- */
const M = {
  brick:  new THREE.MeshStandardMaterial({ map: brickTex, roughness: .95 }),
  cream:  new THREE.MeshStandardMaterial({ color: 0xe9dcc3, roughness: .95 }),
  wood:   new THREE.MeshStandardMaterial({ map: woodTex, roughness: .8 }),
  darkWood: new THREE.MeshStandardMaterial({ map: darkWoodTex, roughness: .85 }),
  counterWood: new THREE.MeshStandardMaterial({ color: 0x6b4423, roughness: .7 }),
  white:  new THREE.MeshStandardMaterial({ color: 0xf7f2e8, roughness: .35 }),
  ceramic: new THREE.MeshStandardMaterial({ color: 0xfdfaf2, roughness: .25 }),
  metal:  new THREE.MeshStandardMaterial({ color: 0xb9c0c7, metalness: .9, roughness: .3 }),
  brass:  new THREE.MeshStandardMaterial({ color: 0xc9973f, metalness: .85, roughness: .35 }),
  glass:  new THREE.MeshStandardMaterial({ color: 0xdfeaf2, roughness: .05, metalness: .1, transparent: true, opacity: .45 }),
  leaf:   new THREE.MeshStandardMaterial({ color: 0x4a7c43, roughness: .9 }),
  soil:   new THREE.MeshStandardMaterial({ color: 0x3a281a, roughness: 1 }),
  terra:  new THREE.MeshStandardMaterial({ color: 0xa9603c, roughness: .9 }),
  cakeCream: new THREE.MeshStandardMaterial({ color: 0xfff6ec, roughness: .5 }),
  sponge: new THREE.MeshStandardMaterial({ color: 0xf3d9a4, roughness: .8 }),
  berry:  new THREE.MeshStandardMaterial({ color: 0xd92b3a, roughness: .35 }),
  black:  new THREE.MeshStandardMaterial({ color: 0x1d1712, roughness: .9 }),
};
function box(w, h, d, mat, x = 0, y = 0, z = 0, parent = scene) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true;
  parent.add(m); return m;
}
function cyl(rt, rb, h, mat, x = 0, y = 0, z = 0, parent = scene, seg = 24) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);
  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true;
  parent.add(m); return m;
}

/* ---------------- wooden box base + floor ---------------- */
{
  box(ROOM.w + 0.5, 0.16, ROOM.d + 0.5, M.darkWood, 0, -0.10, 0);                    // 土台
  box(ROOM.w + 0.14, 0.05, ROOM.d + 0.14, M.counterWood, 0, -0.045, 0);             // 縁
  const floor = box(ROOM.w, 0.04, ROOM.d, M.wood, 0, -0.02, 0);                    // 床（上面 y=0）
  floor.castShadow = false;
  const rug = new THREE.Mesh(new THREE.CircleGeometry(0.62, 36),
    new THREE.MeshStandardMaterial({ color: 0x7e3538, roughness: 1 }));
  rug.rotation.x = -Math.PI / 2; rug.position.set(TABLE_POS.x, 0.002, TABLE_POS.z);
  rug.receiveShadow = true; scene.add(rug);
  // 箱が載る暗い木のテーブル面
  const tableTex = canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = '#3a2413'; g.fillRect(0, 0, w, h);
    const rows = 4;
    for (let r = 0; r < rows; r++) {
      const y = r * h / rows;
      g.fillStyle = ['#402914', '#37220f', '#442c16'][(Math.random() * 3) | 0];
      g.fillRect(0, y, w, h / rows - 2);
      g.strokeStyle = 'rgba(15,8,3,0.6)'; g.lineWidth = 2;
      g.beginPath(); g.moveTo(0, y + h / rows - 2); g.lineTo(w, y + h / rows - 2); g.stroke();
      g.strokeStyle = 'rgba(90,60,30,0.35)'; g.lineWidth = 1;
      for (let i = 0; i < 7; i++) {
        const gy = y + 4 + Math.random() * (h / rows - 10);
        g.beginPath(); g.moveTo(0, gy);
        g.bezierCurveTo(w * .3, gy + 2, w * .7, gy - 2, w, gy); g.stroke();
      }
    }
  }, 6, 6);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(36, 36),
    new THREE.MeshStandardMaterial({ map: tableTex, roughness: .85 }));
  ground.rotation.x = -Math.PI / 2; ground.position.y = -0.185;
  ground.receiveShadow = true; scene.add(ground);
  // 背景：夕景グラデーション＋大きなボケの背景板
  const bdTex = canvasTex(512, 256, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, 0, h);
    gr.addColorStop(0, '#0a1526'); gr.addColorStop(0.6, '#14273f'); gr.addColorStop(1, '#1d3450');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    const bok = [[70, 150, 26, '255,170,90'], [150, 90, 14, '255,200,130'], [250, 170, 34, '255,160,70'],
      [330, 80, 12, '240,240,255'], [400, 140, 22, '255,180,100'], [460, 60, 10, '255,210,150'],
      [110, 195, 12, '255,190,120'], [290, 110, 9, '255,220,180'], [430, 200, 16, '255,150,80'],
      [190, 140, 8, '255,230,200'], [40, 70, 9, '255,190,120'], [370, 185, 8, '255,220,190']];
    for (const [x, y, r, c] of bok) {
      const rg = g.createRadialGradient(x, y, 0, x, y, r);
      rg.addColorStop(0, `rgba(${c},0.85)`); rg.addColorStop(0.55, `rgba(${c},0.35)`); rg.addColorStop(1, `rgba(${c},0)`);
      g.fillStyle = rg; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
    }
  }, 1, 1);
  const backdrop = new THREE.Mesh(new THREE.PlaneGeometry(46, 20),
    new THREE.MeshBasicMaterial({ map: bdTex }));
  backdrop.position.set(0, 6.5, -16); scene.add(backdrop);
}

/* ---------------- wooden box frame（前面の柱・梁・下リップ） ---------------- */
{
  const fm = M.darkWood;
  const px = ROOM.w / 2 + 0.07, pz = ROOM.d / 2 + 0.06;   // 柱位置 ±1.77 / z 1.66
  box(0.15, 2.06, 0.15, fm, -px, 1.01, pz);               // 左柱
  box(0.15, 2.06, 0.15, fm,  px, 1.01, pz);               // 右柱
  box(px * 2 + 0.3, 0.14, 0.15, fm, 0, 2.08, pz);          // 前面上梁
  box(0.15, 0.13, ROOM.d + 0.2, fm, -px, 2.08, 0);        // 左上レール
  box(0.15, 0.13, ROOM.d + 0.2, fm,  px, 2.08, 0);        // 右上レール
  box(ROOM.w + 0.3, 0.15, 0.1, fm, 0, 0.035, pz - 0.02);   // 前面下のリップ
}

/* ---------------- foreground greenery（苔・小花・小鉢・小枝） ---------------- */
const leafGeo = new THREE.SphereGeometry(0.05, 10, 8);
{
  const mossMats = [0x5d8140, 0x6f9550, 0x49682f].map(c =>
    new THREE.MeshStandardMaterial({ color: c, roughness: 1 }));
  const mossGeo = new THREE.SphereGeometry(1, 10, 8);
  const soilStrip = box(ROOM.w - 0.1, 0.05, 0.34, M.soil, 0, 0.025, 1.42);
  soilStrip.castShadow = false;
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  // 苔マウンド
  for (let i = 0; i < 46; i++) {
    const m = new THREE.Mesh(mossGeo, mossMats[i % 3]);
    const r = 0.045 + rnd() * 0.06;
    m.scale.set(r, r * 0.45, r);
    m.position.set(-1.58 + rnd() * 3.16, 0.045, 1.30 + rnd() * 0.24);
    m.receiveShadow = true; scene.add(m);
  }
  // 小花（白い花＋細い茎）
  const stemMat = new THREE.MeshStandardMaterial({ color: 0x51703c, roughness: 1 });
  const flowerMat = new THREE.MeshStandardMaterial({ color: 0xf6efdd, roughness: .8 });
  const stemGeo = new THREE.CylinderGeometry(0.0022, 0.0022, 1, 5);
  const budGeo = new THREE.SphereGeometry(0.013, 8, 6);
  for (let i = 0; i < 18; i++) {
    const fx = -1.55 + rnd() * 3.1, fz = 1.32 + rnd() * 0.2, fh = 0.07 + rnd() * 0.07;
    const st = new THREE.Mesh(stemGeo, stemMat);
    st.scale.y = fh; st.position.set(fx, 0.05 + fh / 2, fz); scene.add(st);
    const bud = new THREE.Mesh(budGeo, flowerMat);
    bud.position.set(fx, 0.05 + fh + 0.008, fz); bud.castShadow = true; scene.add(bud);
  }
  // 小枝
  const twigMat = new THREE.MeshStandardMaterial({ color: 0x5d4126, roughness: 1 });
  for (const [tx, tz, rz, ry] of [[-1.25, 1.47, 1.35, 0.4], [0.9, 1.36, 1.5, -0.7], [1.45, 1.5, 1.2, 0.9]]) {
    const tw = cyl(0.008, 0.011, 0.34, twigMat, tx, 0.06, tz);
    tw.rotation.set(0, ry, rz);
  }
  // 前面コーナーの小鉢 ×2
  function cornerPot(x, z) {
    cyl(0.055, 0.042, 0.085, M.terra, x, 0.043, z);
    cyl(0.05, 0.05, 0.015, M.soil, x, 0.088, z);
    for (let i = 0; i < 5; i++) {
      const leaf = new THREE.Mesh(leafGeo, M.leaf);
      const a = i * 1.35;
      leaf.position.set(x + Math.cos(a) * 0.028, 0.13 + (i % 2) * 0.035, z + Math.sin(a) * 0.028);
      leaf.scale.set(0.8, 1.5, 0.8); leaf.rotation.z = Math.cos(a) * 0.5;
      leaf.castShadow = true; scene.add(leaf);
    }
  }
  cornerPot(-1.52, 1.4); cornerPot(1.52, 1.4);
  // 左壁の内側・手前を這う苔
  for (let i = 0; i < 7; i++) {
    const m = new THREE.Mesh(mossGeo, mossMats[i % 3]);
    const r = 0.04 + rnd() * 0.035;
    m.scale.set(r * 0.6, r, r * 0.6);
    m.position.set(-1.66 + rnd() * 0.03, 0.15 + i * 0.22 + rnd() * 0.08, 1.58 - rnd() * 0.06);

/* ---------------- wall fade ---------------- */
function collectFadeMats(group) {
  const mats = [];
  group.traverse(o => {
    if (o.isMesh) {
      const arr = Array.isArray(o.material) ? o.material : [o.material];
      const cloned = arr.map(m => { const c = m.clone(); c.transparent = true; mats.push(c); return c; });
      o.material = Array.isArray(o.material) ? cloned : cloned[0];
    }
  });
  return mats;
}
const walls = [
  { name: '背面', group: backGroup, mats: null, cur: 1, target: 1, isOut: cp => cp.z < -ROOM.d / 2 - 0.05 },
  { name: '左', group: leftGroup, mats: null, cur: 1, target: 1, isOut: cp => cp.x < -ROOM.w / 2 - 0.05 },
  { name: '右', group: rightGroup, mats: null, cur: 1, target: 1, isOut: cp => cp.x > ROOM.w / 2 + 0.05 },
];
for (const w of walls) w.mats = collectFadeMats(w.group);
const wallStatusEl = document.getElementById('wallStatus');
let lastWallText = '';
const _camPos = new THREE.Vector3();
function updateWalls() {
  camera.getWorldPosition(_camPos);
  const faded = [];
  for (const w of walls) {
    w.target = w.isOut(_camPos) ? 0.08 : 1;
    w.cur += (w.target - w.cur) * 0.14;
    if (Math.abs(w.target - w.cur) < 0.005) w.cur = w.target;
    for (const m of w.mats) { m.opacity = w.cur; m.depthWrite = w.cur > 0.95; }
    if (w.target < 1) faded.push(w.name);
  }
  const txt = faded.length ? `壁フェード中：${faded.join('・')}の壁` : '壁はすべて表示中';
  if (txt !== lastWallText) { wallStatusEl.textContent = txt; lastWallText = txt; }
}

/* ---------------- view presets ---------------- */
const VIEWS = {

}

/* ---------------- models ---------------- */
const loadBar = document.getElementById('loadBar');
const loadMsg = document.getElementById('loadMsg');
const loadErr = document.getElementById('loadErr');
const lm = new THREE.LoadingManager();
lm.onProgress = (u, l, t) => { loadBar.style.width = Math.round(l / t * 100) + '%'; loadMsg.textContent = `読み込み中… ${l}/${t}`; };
function hideLoading() { const el = document.getElementById('loading'); if (!el || el.style.display === 'none') return; el.classList.add('done'); setTimeout(() => { el.style.display = 'none'; }, 700); }
lm.onLoad = hideLoading;
let settledModels = 0;
function settleModel() { if (++settledModels >= 3) hideLoading(); }
setTimeout(hideLoading, 25000);
const loader = new GLTFLoader(lm);
loader.setMeshoptDecoder(MeshoptDecoder);

function placeModel(gltf, height, place, frontOffset) {
  const root = gltf.scene;
  const box3 = new THREE.Box3().setFromObject(root);
  const size = box3.getSize(new THREE.Vector3());
  const s = height / size.y;
  root.scale.setScalar(s);
  root.position.set(
    -(box3.min.x + box3.max.x) / 2 * s,
    -box3.min.y * s,
    -(box3.min.z + box3.max.z) / 2 * s);
  root.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = false; } });
  const wrap = new THREE.Group();
  wrap.add(root);
  wrap.position.copy(place.pos);
  wrap.rotation.y = Math.atan2(place.faceTo.x - place.pos.x, place.faceTo.z - place.pos.z) + frontOffset;
  scene.add(wrap);
  return wrap;
}
const MODEL_FILES = [
  { key: 'rin', file: 'models/rin.glb', h: SEATED_H },
  { key: 'shiro', file: 'models/shiro.glb', h: SEATED_H },
  { key: 'manager', file: 'models/manager.glb', h: MANAGER_H },
];
for (const mf of MODEL_FILES) {
  loader.load(mf.file,
    g => { placeModel(g, mf.h, PLACEMENT[mf.key], FRONT_OFFSET[mf.key]); settleModel(); },
    undefined,
    err => { settleModel();
      console.error(mf.file, err);
      loadErr.textContent += `⚠ ${mf.file} の読み込みに失敗しました\n`;
      const chip = document.getElementById('modelErr');
      chip.textContent = `⚠ ${mf.file} が読み込めませんでした`;
      chip.style.display = 'block';
    });
}

/* ---------------- loop ---------------- */
const clock = new THREE.Clock();
function ease(t) { return t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  if (camAnim) {
    camAnim.t += dt / camAnim.dur;
    const k = ease(Math.min(camAnim.t, 1));
    camera.position.lerpVectors(camAnim.p0, camAnim.p1, k);
    controls.target.lerpVectors(camAnim.g0, camAnim.g1, k);
    if (camAnim.t >= 1) camAnim = null;
  }
  controls.update();
  updateWalls();
  for (let i = 0; i < lampLights.length; i++) {
    const f = 1 + 0.045 * Math.sin(t * 7 + i * 1.7) + 0.03 * Math.sin(t * 12.7 + i * 2.3);
    lampLights[i].intensity = 5 * f;
    lampShades[i].emissiveIntensity = 1.0 * f;
  }
  for (const s of steams) {
    const p = ((t * 0.25 + s.userData.phase) % 1);
    s.position.set(
      s.userData.base.x + Math.sin(t * 1.3 + s.userData.phase) * 0.008,
      s.userData.base.y + p * 0.11,
      s.userData.base.z);
    const sc = 0.03 + p * 0.05; s.scale.set(sc, sc, 1);
    s.material.opacity = 0.4 * Math.sin(p * Math.PI);
  }
  renderer.render(scene, camera);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
